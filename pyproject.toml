[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uniadvisor"
version = "1.0.0"
description = "UniAdvisor: helps Vietnamese grade-12 students choose a major and build their nguyện vọng list"
requires-python = ">=3.12,<3.13"
# Pinned to the versions the app was tested with: the chat classifier is a pickled scikit-learn pipeline
# (models/message_classifier/model.joblib) that needs the same scikit-learn to load.
# What the web API needs (Vercel and the Dockerfile install exactly this): the planner's libraries and the API.
# Streamlit is an extra (`ui`) so the hosted API stays far below Vercel's 500 MB limit for a Python function.
dependencies = [
    "pandas==3.0.6",
    "numpy==2.5.3",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "joblib==1.6.0",
    "fastapi==0.143.1",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "slowapi==0.1.10",
    "huggingface_hub==2.2.0",
]

[project.optional-dependencies]
# The Streamlit app (app.py): requirements.txt installs it for Streamlit Community Cloud.
ui = [
    "streamlit==1.65.0",
    "altair==6.3.0",
]
dev = ["pytest>=8", "pytest-cov>=5", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uniadvisor = ["data/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # the offline pipelines (pipelines/) are run from the repository root
addopts = "-q"

[tool.vercel]
entrypoint = "web_api:app"      # a root app.py is the Streamlit entry point, so the API has its own file
