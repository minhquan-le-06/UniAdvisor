[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uniadvisor"
version = "0.1.0"
description = "UniAdvisor v2: helps Vietnamese grade-12 students choose a major and build their nguyện vọng list"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyyaml>=6.0",
    "streamlit>=1.50",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uniadvisor = ["data/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
