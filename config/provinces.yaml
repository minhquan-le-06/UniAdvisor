# Home province -> home city: provinces from Huế northward -> Hà Nội; from Đà Nẵng southward -> TP.HCM.
# The 34 province-level units after the 2025 merger (Nghị quyết 202/2025/QH15, Điều 1).
# Every merged unit lies wholly on one side of the Huế / Đà Nẵng line, so the city is the same for all its former
# provinces. `aliases` are other names a student may type, including the former provinces merged into the unit;
# they map to the same entry (an old plan file with a former province name opens on the new unit).

HN:
  - {name: "Hà Nội"}
  - {name: "Tuyên Quang", aliases: ["Hà Giang"]}
  - {name: "Cao Bằng"}
  - {name: "Lào Cai", aliases: ["Yên Bái"]}
  - {name: "Thái Nguyên", aliases: ["Bắc Kạn"]}
  - {name: "Điện Biên"}
  - {name: "Lai Châu"}
  - {name: "Sơn La"}
  - {name: "Phú Thọ", aliases: ["Vĩnh Phúc", "Hòa Bình"]}
  - {name: "Lạng Sơn"}
  - {name: "Quảng Ninh"}
  - {name: "Bắc Ninh", aliases: ["Bắc Giang"]}
  - {name: "Hải Phòng", aliases: ["Hải Dương"]}
  - {name: "Hưng Yên", aliases: ["Thái Bình"]}
  - {name: "Ninh Bình", aliases: ["Hà Nam", "Nam Định"]}
  - {name: "Thanh Hóa"}
  - {name: "Nghệ An"}
  - {name: "Hà Tĩnh"}
  - {name: "Quảng Trị", aliases: ["Quảng Bình"]}
  - {name: "Huế", aliases: ["Thừa Thiên Huế"]}

HCM:
  - {name: "Đà Nẵng", aliases: ["Quảng Nam"]}
  - {name: "Quảng Ngãi", aliases: ["Kon Tum"]}
