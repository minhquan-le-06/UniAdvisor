# The "Chưa xác định ngành" questions, revision 2, approved on 2026-10-08.
# The single source for the app's questionnaire and the student-generation notebook.
#
# Each option: code (stable id), label (UI text, Vietnamese; also what the writer LLM must copy exactly) and its data
# source, used for the fixed data scores before anything is learned:
#   holland: RIASEC letters (O*NET Career Interest Types; Holland 1997; Prediger 1982 for Q3)
#   knowledge: an O*NET Knowledge area (nganh_knowledge.element)
#   work_context: an O*NET Work Context element id (nganh_work_context.element_id); `against: true` when choosing the
#     option counts against ngành with a high value (Q12, "Một mình")
#   subject: an exam subject code (Q1, Q2: the admission-combination score and the subject's knowledge area)
# An option without any of these is learned only.

subjects_knowledge:          # Q1/Q2: the O*NET knowledge area a liked subject points to
  TO: Mathematics
  VA: English Language       # O*NET's "English Language" is the native language
  N1: Foreign Language
  LI: Physics
  HO: Chemistry
  SI: Biology
  SU: History and Archeology
  DI: Geography
  GDKTPL: Law and Government
  TI: Computers and Electronics
  CNCN: Engineering and Technology
  CNNN: Food Production
  N3: Foreign Language
  N4: Foreign Language
  N6: Foreign Language
  N7: Foreign Language
  N5: Foreign Language
  N2: Foreign Language

questions:
  - id: q1
    text: Em thích học môn nào?
    answer: {kind: multi, max: 3}
    options: &subjects
      - {code: TO, label: Toán, subject: TO}
      - {code: VA, label: Ngữ văn, subject: VA}
      - {code: N1, label: Tiếng Anh, subject: N1}
      - {code: LI, label: Vật lí, subject: LI}
      - {code: HO, label: Hóa học, subject: HO}
      - {code: SI, label: Sinh học, subject: SI}
      - {code: SU, label: Lịch sử, subject: SU}
      - {code: DI, label: Địa lí, subject: DI}
      - {code: GDKTPL, label: Giáo dục kinh tế và pháp luật, subject: GDKTPL}
      - {code: TI, label: Tin học, subject: TI}
      - {code: CNCN, label: Công nghệ công nghiệp, subject: CNCN}
      - {code: CNNN, label: Công nghệ nông nghiệp, subject: CNNN}
      - {code: N3, label: Tiếng Pháp, subject: N3}
      - {code: N4, label: Tiếng Trung, subject: N4}
      - {code: N6, label: Tiếng Nhật, subject: N6}
      - {code: N7, label: Tiếng Hàn, subject: N7}
      - {code: N5, label: Tiếng Đức, subject: N5}
      - {code: N2, label: Tiếng Nga, subject: N2}

  - id: q2
    text: Môn nào em không thích?
    answer: {kind: multi, max: 3, not_in: q1}
    negative: true
    options: *subjects

  - id: q3
    text: Em thích làm việc với điều gì?
    answer: {kind: multi, max: 2}
    options:
      - {code: people, label: Con người, holland: SE}
      - {code: machines, label: Máy móc, holland: R}
      - {code: data, label: Số liệu, holland: C}
      - {code: ideas, label: Ý tưởng, holland: IA}

  - id: q4
    text: Em thích làm những việc nào?
    answer: {kind: multi, max: 4}
    options:
      - {code: repair, label: Sửa chữa đồ đạc, holland: R}
      - {code: electronics, label: Lắp ráp đồ điện tử, holland: R}
      - {code: code, label: Viết code, holland: I, knowledge: Computers and Electronics}   # 2026-10-08
      - {code: experiment, label: Làm thí nghiệm, holland: I}
      - {code: hard_problem, label: Giải bài toán khó, holland: I}
      - {code: how_machines_work, label: Tìm hiểu máy móc hoạt động ra sao, holland: I}
      - {code: plants, label: Trồng cây, holland: R}
      - {code: animals, label: Chăm sóc con vật, holland: R}
      - {code: cooking, label: Nấu ăn, holland: R}
      - {code: sport, label: Chơi thể thao, holland: R, knowledge: Education and Training}   # 2026-10-08
      - {code: drawing, label: Vẽ, holland: A}
      - {code: photo, label: Chụp ảnh, holland: A}
      - {code: video, label: Làm video, holland: A}
      - {code: stories, label: Viết truyện, holland: A}
      - {code: instrument, label: Chơi nhạc cụ, holland: A}

  - id: q5
    text: Còn những việc này?
    answer: {kind: multi, max: 4}
    options:
      - {code: tutoring, label: Giảng bài cho bạn, holland: S}
      - {code: listening, label: Nghe bạn bè tâm sự, holland: S}
      - {code: caring_sick, label: Chăm sóc người ốm, holland: S}
      - {code: volunteering, label: Làm tình nguyện, holland: S}
      - {code: events, label: Tổ chức sự kiện, holland: E}
      - {code: presenting, label: Thuyết trình, holland: E}
      - {code: debating, label: Tranh luận, holland: E}
      - {code: selling, label: Bán hàng, holland: E}
      - {code: budgeting, label: Quản lý chi tiêu, holland: C}
      - {code: filing, label: Sắp xếp tài liệu, holland: C}
      - {code: novels, label: Đọc tiểu thuyết, holland: A}
      - {code: news, label: Theo dõi thời sự}

  - id: q6
    text: Em thích tìm hiểu về chủ đề nào?
    answer: {kind: multi, max: 4}
    options: &topics
      - {code: computers, label: Máy tính, knowledge: Computers and Electronics}
      - {code: electronics_topic, label: Điện tử, knowledge: Telecommunications}
      - {code: mechanics, label: Cơ khí, knowledge: Mechanical}
      - {code: construction, label: Xây dựng, knowledge: Building and Construction}
      - {code: health, label: Sức khỏe, knowledge: Medicine and Dentistry}
      - {code: psychology, label: Tâm lý, knowledge: Psychology}
      - {code: society, label: Các vấn đề xã hội, knowledge: Sociology and Anthropology}
      - {code: economics, label: Kinh tế, knowledge: Economics and Accounting}
      - {code: marketing, label: Marketing, knowledge: Sales and Marketing}
      - {code: business, label: Quản lý doanh nghiệp, knowledge: Administration and Management}
      - {code: law, label: Pháp luật, knowledge: Law and Government}
      - {code: journalism, label: Báo chí, knowledge: Communications and Media}
      - {code: literature, label: Văn chương, knowledge: English Language}
      - {code: languages, label: Ngoại ngữ, knowledge: Foreign Language}
      - {code: history, label: Lịch sử, knowledge: History and Archeology}
      - {code: geography, label: Địa lý, knowledge: Geography}
      - {code: arts, label: Nghệ thuật, knowledge: Fine Arts}
      - {code: agriculture, label: Nông nghiệp, knowledge: Food Production}
      - {code: cuisine, label: Ẩm thực, knowledge: Food Production}
      - {code: environment, label: Môi trường, knowledge: Biology}
      - {code: transport, label: Giao thông vận tải, knowledge: Transportation}
      - {code: education, label: Giáo dục, knowledge: Education and Training}
      - {code: philosophy, label: Triết học, knowledge: Philosophy and Theology}

  - id: q7
    text: Có chủ đề nào em chắc chắn không muốn học?
    answer: {kind: multi, max: 3, not_in: q6}
    negative: true
    options: *topics

  - id: q8
    text: Sau này em muốn làm việc chủ yếu ở đâu?
    answer: {kind: multi, max: 3}
    options:
      - {code: office, label: Văn phòng, work_context: 4.C.2.a.1.a}
      - {code: workshop, label: Nhà xưởng, work_context: 4.C.2.a.1.b}
      - {code: outdoors, label: Ngoài trời, work_context: 4.C.2.a.1.c}
      - {code: vehicle, label: Trên phương tiện giao thông, work_context: 4.C.2.a.1.f}
      - {code: hospital, label: Bệnh viện}
      - {code: school, label: Trường học}
      - {code: lab, label: Phòng thí nghiệm}
      - {code: site, label: Công trường}
      - {code: farm, label: Trang trại}
      - {code: hotel, label: Khách sạn}
      - {code: shop, label: Cửa hàng}
      - {code: home, label: Tại nhà}

  - id: q9
    text: Em thích làm việc thế nào?
    answer: {kind: single}
    options:
      - {code: alone, label: Một mình, holland: IR, work_context: 4.C.1.a.4, against: true}
      - {code: team, label: Cùng một nhóm, work_context: 4.C.1.b.1.e}
      - {code: new_people, label: Gặp gỡ nhiều người mới, holland: SE, work_context: 4.C.1.b.1.f}

  - id: q10
    text: Em thích công việc như thế nào hơn?
    answer: {kind: single}
    options:
      - {code: procedure, label: Làm theo quy trình rõ ràng, holland: C, work_context: 4.C.3.b.7}
      - {code: own_way, label: Tự nghĩ ra cách làm, holland: AI, work_context: 4.C.3.a.4}

  - id: q11
    text: Điều gì quan trọng nhất với em trong công việc sau này?
    answer: {kind: single}
    options:
      - {code: helping, label: Giúp đỡ người khác, holland: S}
      - {code: making, label: Làm ra sản phẩm cầm nắm được, holland: R}
      - {code: understanding, label: Hiểu vì sao mọi thứ xảy ra, holland: I}
      - {code: expressing, label: Thể hiện ý tưởng của mình, holland: A}
      - {code: leading, label: Dẫn dắt người khác, holland: E}
      - {code: accuracy, label: Làm việc chính xác, holland: C, work_context: 4.C.3.b.4}

  - id: q12
    text: Em không muốn công việc có điều nào?
    answer: {kind: multi, max: 4}
    options:
      - {code: blood, label: Thấy máu}
      - {code: sick_people, label: Tiếp xúc với người bệnh, work_context: 4.C.2.c.1.b, against: true}
      - {code: night_shift, label: Làm ca đêm}
      - {code: away_from_home, label: Thường xuyên đi xa nhà}
      - {code: sitting, label: Ngồi một chỗ cả ngày, work_context: 4.C.2.d.1.a, against: true}
      - {code: standing, label: Đứng cả ngày, work_context: 4.C.2.d.1.b, against: true}
      - {code: public_speaking, label: Nói trước đông người, work_context: 4.C.1.a.2.c, against: true}
      - {code: outdoor_work, label: Làm việc ngoài trời, work_context: 4.C.2.a.1.c, against: true}
      - {code: heights, label: Làm việc trên cao, work_context: 4.C.2.c.1.c, against: true}
      - {code: chemicals, label: Tiếp xúc hóa chất, work_context: 4.C.2.b.1.d, against: true}
      - {code: noise, label: Tiếng ồn lớn, work_context: 4.C.2.b.1.a, against: true}
      - {code: time_pressure, label: Áp lực thời gian, work_context: 4.C.3.d.1, against: true}
      - {code: angry_people, label: Đối mặt với người nóng giận, work_context: 4.C.1.d.2, against: true}
      - {code: overtime, label: Làm thêm giờ thường xuyên, work_context: "4.C.3.d.8:3", against: true}
      - {code: sales_targets, label: Chạy doanh số, work_context: 4.C.3.c.1, against: true}

free_text:
  label: Kể thêm về em
  placeholder: "Ví dụ: nghề em mơ ước, việc em thích làm, điều em không muốn"

# Groups the model suggests: every nhóm ngành with an in-scope program, except these.
exclude_groups: ["78601", "78602"]
