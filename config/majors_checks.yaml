# Hand-written behaviour checks of the major suggester: plain students whose suitable groups are obvious. A case
# passes when at least one `expect` group is in the top 5. Drafted on 2026-10-08 (for review
# LLM to review); they test any scorer: the data scores now, the learned model later. Answers use the option labels of
# config/questionnaire.yaml; unanswered questions are skipped.

