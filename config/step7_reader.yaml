# Step 7 free-text reader (suggest/reader.py): plain phrases per option, written with accents. Draft of
# 2026-10-08, for review by an LLM. An option's own label always counts as a phrase too.
#
# Matching: lowercase, on the text with accents; a student who typed without accents is matched on the accent-free
# form of a phrase only when that form cannot be confused (two words or more, or one word of 5+ letters): "ve" is
# both "vẽ" and "về", "mau" both "máu" and "màu", "toan" both "toán" and "toàn".
#
# `positive`: options read from a clause that says no dislike; in a clause that does ("không thích", "ghét", ...),
# subjects go to q2, topics to q7, and the work conditions of `negative` to q12.

negation: ["không thích", "ghét", "sợ", "không muốn", "ngại", "chán", "không hợp", "không ưa", "tránh", "dị ứng",
           "ko thích", "k thích", "chẳng thích", "ko muốn", "chẳng muốn", "không thik", "ko thik"]
# A cue right after one of these is not a dislike: "không ngại", "không sợ", "chẳng chán".
negation_cancel: ["không", "ko", "chẳng", "chả"]

# Words masked before matching (regular expressions on the lowercase text with accents): "môi trường" usually means the
# workplace ("môi trường làm việc", "môi trường ồn ào"), not the environment topic; "quy luật" is not law.
# Checked on the qwen run's texts, 2026-10-08.
mask: ["môi trường(?= (làm việc|học tập|ồn|năng động|thân thiện|yên tĩnh|sôi động|chuyên nghiệp|lành mạnh|xung quanh|tốt|thoải mái|đông|công sở|văn phòng|áp lực|cạnh tranh|mới|quốc tế|nhiều))",
       "quy luật"]
clause_breaks: [",", ".", ";", "!", "?", "\n", " nhưng ", " mà ", " còn ", " tuy nhiên ", " nhung "]  # not " con ": "con vật"

